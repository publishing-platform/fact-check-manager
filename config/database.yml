default: &default
  adapter: postgresql
  encoding: unicode
  pool: 12

development:
  <<: *default
  database: fact_check_manager_development
  url: <%= ENV["DATABASE_URL"]%>

test:
  <<: *default
  database: fact_check_manager_test
  url: <%= ENV["TEST_DATABASE_URL"] %>

production:
  <<: *default
  database: fact_check_manager
  url: <%= ENV["DATABASE_URL"]%>
